name: OpenClaw validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: openclaw-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-tests:
    name: deployment tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements-deploy.txt
      - name: Run deployment behavior tests
        run: python -m pytest tests/deploy/ -q
      - name: Run tracked-file security audit
        run: python scripts/security_audit.py

  compose-validation:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose shape without pulling images
        working-directory: deploy/openclaw
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Validate redacted preflight report
        run: python scripts/openclaw_diagnostic.py --mode preflight --skip-docker --pretty

  javascript-validation:
    name: JavaScript behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check deployment JavaScript syntax
        run: |
          node --check deploy/openclaw/context-recovery-core.mjs
          node --check deploy/openclaw/context-recovery.mjs
          node --check deploy/openclaw/cron-jobs.mjs
          node --check deploy/openclaw/diagnostic-policy.mjs
          node --check deploy/openclaw/media-policy.mjs
          node --check deploy/openclaw/qq-diagnostic-filter.mjs
          node --check deploy/openclaw/qqbot-history-media-patch.mjs
          node --check deploy/openclaw/web-search-patch.mjs
      - name: Run media, context, diagnostic, and cron behavior tests
        run: node --test tests/node/*.test.mjs

  powershell-validation:
    name: PowerShell and Windows launcher
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows environment contract with placeholders allowed
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File deploy/openclaw/Test-OpenClawEnvironment.ps1 -EnvFile deploy/openclaw/.env.example -AllowPlaceholders
      - name: Parse PowerShell and verify BAT wiring
        shell: pwsh
        run: |
          $files = @(
            'deploy/openclaw/Test-OpenClawEnvironment.ps1',
            'deploy/openclaw/Start-OpenClawDocker.ps1',
            'deploy/openclaw/Start-OpenClawVision.ps1',
            'deploy/openclaw/Stop-OpenClawVision.ps1',
            'deploy/openclaw/Set-OpenClawMediaCapabilities.ps1',
            'deploy/openclaw/Watch-OpenClawModel.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parse failed: $file" }
          }
          $bat = Get-Content -Raw scripts/windows/Start-OpenClawQQBot.bat
          if ($bat -notmatch 'deploy\\openclaw\\Start-OpenClawDocker\.ps1') { throw 'Windows BAT launcher is not wired to the Docker launcher.' }

  shell-validation:
    name: Unix launcher and diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax and contract diagnostics
        run: |
          sh -n deploy/openclaw/setup.sh
          sh -n deploy/openclaw/validate-env.sh
          sh deploy/openclaw/validate-env.sh --env-file deploy/openclaw/.env.example --diagnose --allow-placeholders
          python scripts/openclaw_diagnostic.py --mode preflight --skip-docker --pretty
          python scripts/openclaw_diagnostic.py --mode health --skip-docker --pretty

  repository-hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace and tracked-file boundaries
        run: |
          git diff --check
          test ! -e deploy/openclaw/.env
          test ! -d deploy/openclaw/runtime
          test ! -e test_durations.json
