# Local-only overlay. Values are supplied by .env and never stored in the
# repository.
services:
  openclaw-gateway:
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID}
      QQBOT_CLIENT_SECRET: ${QQBOT_CLIENT_SECRET}
      QQBOT_ALLOWED_USER_OPENID: ${QQBOT_ALLOWED_USER_OPENID}
      QQBOT_ALLOWED_MEMBER_OPENID: ${QQBOT_ALLOWED_MEMBER_OPENID}
      CODEX_PROXY_BASE_URL: ${CODEX_PROXY_BASE_URL}
      CODEX_PROXY_TOKEN: ${CODEX_PROXY_TOKEN}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  openclaw-cli:
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID}
      QQBOT_CLIENT_SECRET: ${QQBOT_CLIENT_SECRET}
      QQBOT_ALLOWED_USER_OPENID: ${QQBOT_ALLOWED_USER_OPENID}
      QQBOT_ALLOWED_MEMBER_OPENID: ${QQBOT_ALLOWED_MEMBER_OPENID}
      CODEX_PROXY_BASE_URL: ${CODEX_PROXY_BASE_URL}
      CODEX_PROXY_TOKEN: ${CODEX_PROXY_TOKEN}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
