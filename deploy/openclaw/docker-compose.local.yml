# Local-only overlay. Values are supplied by Start-OpenClaw.ps1 and never
# stored in this file or in the repository.
services:
  openclaw-gateway:
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID}
      QQBOT_CLIENT_SECRET: ${QQBOT_CLIENT_SECRET}
      QQBOT_ALLOWED_USER_OPENID: ${QQBOT_ALLOWED_USER_OPENID}
      QQBOT_ALLOWED_MEMBER_OPENID: ${QQBOT_ALLOWED_MEMBER_OPENID}
      SENSENOVA_API_KEY: ${SENSENOVA_API_KEY}
      HERMES_DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
  openclaw-cli:
    environment:
      QQBOT_APP_ID: ${QQBOT_APP_ID}
      QQBOT_CLIENT_SECRET: ${QQBOT_CLIENT_SECRET}
      QQBOT_ALLOWED_USER_OPENID: ${QQBOT_ALLOWED_USER_OPENID}
      QQBOT_ALLOWED_MEMBER_OPENID: ${QQBOT_ALLOWED_MEMBER_OPENID}
      SENSENOVA_API_KEY: ${SENSENOVA_API_KEY}
      HERMES_DEEPSEEK_API_KEY: ${HERMES_DEEPSEEK_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
