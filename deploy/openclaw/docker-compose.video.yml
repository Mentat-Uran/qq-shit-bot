services:
  video-bridge:
    profiles: ["heavy-media"]
    build:
      context: .
      dockerfile: vision-runtime/Dockerfile
      target: video
      args:
        BASE_IMAGE: ${MAGE_VIDEO_BASE_IMAGE:-vllm/vllm-openai:v0.26.0}
    restart: "no"
    init: true
    gpus: all
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${MAGE_VIDEO_PORT:-30000}:8080"
    environment:
      MODEL_ID: ${MAGE_MODEL_ID:-microsoft/Mage-VL}
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      MAX_UPLOAD_BYTES: ${MAGE_MAX_UPLOAD_BYTES:-209715200}
      MAX_COMPRESSED_BYTES: ${MAGE_MAX_COMPRESSED_BYTES:-104857600}
      VIDEO_COMPRESS_WIDTH: ${MAGE_VIDEO_COMPRESS_WIDTH:-960}
      VIDEO_COMPRESS_FPS: ${MAGE_VIDEO_COMPRESS_FPS:-24}
      VIDEO_COMPRESS_CRF: ${MAGE_VIDEO_COMPRESS_CRF:-30}
      VIDEO_COMPRESS_TIMEOUT_SECONDS: ${MAGE_VIDEO_COMPRESS_TIMEOUT_SECONDS:-300}
      DEFAULT_NUM_FRAMES: ${MAGE_VIDEO_NUM_FRAMES:-8}
      MAX_NEW_TOKENS: ${MAGE_MAX_NEW_TOKENS:-384}
      SEGMENT_SECONDS: ${MAGE_VIDEO_SEGMENT_SECONDS:-60}
      MAX_SEGMENTS: ${MAGE_VIDEO_MAX_SEGMENTS:-8}
      GPU_LOCK_PATH: /run/ai-lock/gpu.lock
      MODEL_DEVICE: ${MAGE_MODEL_DEVICE:-cuda:0}
      MODEL_DTYPE: ${MAGE_MODEL_DTYPE:-float16}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: ${MAGE_OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MAGE_MKL_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - mage-vl-hf-cache:/root/.cache/huggingface
      - ai-gpu-lock:/run/ai-lock
      - ./video-bridge/server.py:/app/server.py:ro
    mem_limit: ${MAGE_VIDEO_MEMORY_LIMIT:-10g}
    cpus: ${MAGE_VIDEO_CPUS:-4.0}
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  image-fusion:
    profiles: ["heavy-media"]
    build:
      context: .
      dockerfile: vision-runtime/Dockerfile
      target: image
      args:
        BASE_IMAGE: ${NVIDIA_IMAGE_BASE_IMAGE:-vllm/vllm-openai:v0.26.0}
    restart: "no"
    init: true
    gpus: all
    shm_size: "2gb"
    ports:
      - "127.0.0.1:${NVIDIA_IMAGE_PORT:-30001}:8080"
    environment:
      LOCATE_MODEL_ID: ${NVIDIA_IMAGE_MODEL_ID:-nvidia/LocateAnything-3B}
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://qwen-vision:11434}
      QWEN_MODEL_ID: ${QWEN_MODEL_ID:-qwen2.5vl:7b}
      MAX_UPLOAD_BYTES: ${NVIDIA_IMAGE_MAX_UPLOAD_BYTES:-20971520}
      MAX_NEW_TOKENS: ${NVIDIA_IMAGE_MAX_NEW_TOKENS:-1024}
      QWEN_TIMEOUT_SECONDS: ${QWEN_TIMEOUT_SECONDS:-300}
      GPU_LOCK_PATH: /run/ai-lock/gpu.lock
      MODEL_DEVICE: ${NVIDIA_IMAGE_MODEL_DEVICE:-cuda:0}
      MODEL_DTYPE: ${NVIDIA_IMAGE_MODEL_DTYPE:-float16}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OMP_NUM_THREADS: ${NVIDIA_IMAGE_OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${NVIDIA_IMAGE_MKL_NUM_THREADS:-2}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - mage-vl-hf-cache:/root/.cache/huggingface
      - ai-gpu-lock:/run/ai-lock
      - ./image-fusion/server.py:/app/server.py:ro
    mem_limit: ${NVIDIA_IMAGE_MEMORY_LIMIT:-8g}
    cpus: ${NVIDIA_IMAGE_CPUS:-4.0}
    depends_on:
      qwen-vision:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  openclaw-gateway:
    volumes:
      - ./video-bridge/mage-video-cli.mjs:/opt/openclaw-local/mage-video-cli.mjs:ro
      - ./image-fusion/nvidia-image-cli.mjs:/opt/openclaw-local/nvidia-image-cli.mjs:ro

  openclaw-cli:
    volumes:
      - ./video-bridge/mage-video-cli.mjs:/opt/openclaw-local/mage-video-cli.mjs:ro
      - ./image-fusion/nvidia-image-cli.mjs:/opt/openclaw-local/nvidia-image-cli.mjs:ro

volumes:
  # These caches are retained across the project-name migration.
  mage-vl-hf-cache:
    name: hermes-qq-openclaw_mage-vl-hf-cache
  ai-gpu-lock:
    name: hermes-qq-openclaw_ai-gpu-lock
